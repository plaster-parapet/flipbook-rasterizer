<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flipbook Viewer</title>
<style>
:root{
  --bg:#15171c;
  --toolbar-bg:#1d2027;
  --toolbar-border:#2c3038;
  --text:#e8e9ec;
  --text-dim:#9096a3;
  --accent:#4f8cff;
  --btn-bg:#262a33;
  --btn-bg-hover:#323744;
  --btn-bg-active:#3a4050;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
  overscroll-behavior:none;
}

#app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

/* ---------- Toolbar ---------- */
#toolbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:var(--toolbar-bg);
  border-bottom:1px solid var(--toolbar-border);
  z-index:20;
  min-height:52px;
}

.spacer{flex:1 1 auto;}

.tbtn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--btn-bg);
  color:var(--text);
  border:1px solid var(--toolbar-border);
  border-radius:8px;
  padding:8px 12px;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s ease;
}
.tbtn:hover{background:var(--btn-bg-hover);}
.tbtn:active{background:var(--btn-bg-active);}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.primary:hover{filter:brightness(1.08);}
.tbtn:disabled{opacity:.4;cursor:default;}
.tbtn.active{background:#1f9d55;border-color:#1f9d55;color:#fff;}
.tbtn.active:hover{filter:brightness(1.08);}

.page-indicator{
  font-size:13px;
  color:var(--text-dim);
  min-width:70px;
  text-align:center;
  flex:0 0 auto;
}

.page-jump{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--text-dim);
  flex:0 0 auto;
  white-space:nowrap;
}
.page-jump input{
  width:52px;
  background:var(--btn-bg);
  border:1px solid var(--toolbar-border);
  border-radius:6px;
  color:var(--text);
  font-size:13px;
  text-align:center;
  padding:6px 4px;
  -moz-appearance:textfield;
}
.page-jump input::-webkit-outer-spin-button,
.page-jump input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.restart-btn.hidden{display:none;}

.zoom-controls{
  display:flex;
  align-items:center;
  gap:4px;
  flex:0 0 auto;
}
.zoom-controls .tbtn{
  padding:8px 10px;
  min-width:38px;
  justify-content:center;
  font-variant-numeric:tabular-nums;
}
#btnZoomReset{min-width:56px;font-size:12px;}

/* ---------- Stage ---------- */
#stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#dropHint{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
  padding:24px;
}
#dropHint.hidden{display:none;}
.hint-card{
  text-align:center;
  max-width:360px;
  padding:32px 28px;
  border:1.5px dashed var(--toolbar-border);
  border-radius:16px;
  background:rgba(255,255,255,.02);
}
.hint-card p{margin:0 0 16px;color:var(--text-dim);font-size:14px;line-height:1.5;}
.hint-card .hint-sub{margin:16px 0 0;font-size:12px;}

#viewport{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  touch-action:none;
  padding:28px;
}

/* #flipbook is given an exact pixel width/height by layoutBookContainer()
   rather than filling #viewport: StPageFlip's real flipPrev() animation has
   a hardcoded-coordinate bug that only shows up when there's leftover
   centering slack, so the container is sized to an exact multiple of one
   page's width instead. #zoomLayer just shrink-wraps to #flipbook's size;
   #viewport's flexbox centers it. */
#zoomLayer{
  will-change:transform;
  transform-origin:center center;
}
#zoomLayer.dragging{transition:none !important;}
#zoomLayer.animated{transition:transform .18s ease-out;}

/* Ink overlay: a child of #zoomLayer (sibling of #flipbook), not a sibling
   of #zoomLayer — deliberate. #zoomLayer's own transform (pan + scale, see
   applyTransform) makes it a containing block for absolutely-positioned
   descendants, so inset:0 + width/height:100% here exactly overlays
   #flipbook and rides along with every pan/zoom change automatically via
   inherited transform. Backing-store size still needs a JS resync (see
   syncPenCanvasBox) but position doesn't. */
#penCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:8;
}
#penCanvas.pen-active{
  pointer-events:auto;
  cursor:crosshair;
}

#flipbook{
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  transition:opacity .12s ease;
}
/* Used only for the instant jump-to-page/restart cut, which has no natural
   animation of its own to hint that something changed. */
#flipbook.flipping{opacity:.45;}

/* StPageFlip sets an inline min-width/min-height, equal to our `minWidth`/
   `minHeight` settings, directly on #flipbook itself (it gets class
   .stf__parent). We deliberately pass a huge minWidth for pre-made-spread
   pages to force single-page mode regardless of screen size — neutralize
   the resulting inline style here so it can't blow out the real layout.
   !important is required to win over an inline style. */
.stf__parent{
  min-width:0 !important;
  min-height:0 !important;
}

/* individual page rendered by StPageFlip */
.pf-page{
  background:#fff;
  overflow:hidden;
  /* A brief blank/flash at the start of a flip was reported even on the
     already-shipped single-tier viewer -- a known artifact of 3D CSS
     transforms where the browser hasn't promoted the flipping element to
     its own GPU layer yet when the transform starts. These hints ask for
     that promotion up front instead of triggering it reactively. */
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform:translateZ(0);
}
.pf-page-inner{
  position:relative;
  width:100%;
  height:100%;
}
.page-img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  -webkit-user-drag:none;
}

/* ---------- Nav arrows ---------- */
.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:rgba(20,22,28,.45);
  color:#fff;
  font-size:22px;
  line-height:1;
  cursor:pointer;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(2px);
  transition:background .15s ease,opacity .15s ease;
}
.nav-arrow:hover{background:rgba(20,22,28,.7);}
.nav-arrow.left{left:14px;}
.nav-arrow.right{right:14px;}
.nav-arrow.hidden{display:none;}
.nav-arrow:disabled{opacity:.25;cursor:default;}

#toolbar.disabled{pointer-events:none;opacity:.5;}

/* ---------- Loading overlay ---------- */
#loadingOverlay{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:rgba(15,17,20,.72);
}
#loadingOverlay.hidden{display:none;}
.spinner{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingText{font-size:13px;color:var(--text-dim);}

/* ---------- Responsive ---------- */
@media (max-width:640px){
  #toolbar{padding:6px 8px;gap:4px;}
  .tbtn .label{display:none;}
  .tbtn{padding:9px;min-width:38px;justify-content:center;}
  .tbtn.primary .label{display:inline;}
  .tbtn.primary{padding:10px 16px;}
  .page-indicator{min-width:54px;font-size:11px;}
  .nav-arrow{width:38px;height:38px;font-size:18px;}
  .nav-arrow.left{left:6px;}
  .nav-arrow.right{right:6px;}
}

</style>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="btnLoad" class="tbtn" title="Open pre-rendered page images"> <span class="label">Open Images</span></button>
      <input type="file" id="fileInput" accept="image/*" multiple webkitdirectory hidden>

      <div class="spacer"></div>
      <div class="page-jump" id="pageJumpWrap">
        <span>Page</span>
        <input type="number" id="pageJumpInput" min="1" step="1" inputmode="numeric" title="Jump to page">
        <span id="pageTotalLabel">of –</span>
      </div>
      <div class="spacer"></div>

      <button id="btnRestart" class="tbtn restart-btn hidden" title="Back to first page">⟲ <span class="label">Restart</span></button>

      <div class="zoom-controls">
        <button id="btnPenToggle" class="tbtn" title="Toggle pen tool (P)">🖊 <span class="label">Pen</span></button>
        <button id="btnPenWeight" class="tbtn" title="Toggle line weight">Thin</button>
      </div>

      <div class="zoom-controls">
        <button id="btnZoomOut" class="tbtn" title="Zoom out (Ctrl/Cmd −)">−</button>
        <button id="btnZoomReset" class="tbtn" title="Reset zoom">100%</button>
        <button id="btnZoomIn" class="tbtn" title="Zoom in (Ctrl/Cmd +)">+</button>
      </div>
    </header>

    <main id="stage">
      <div id="dropHint">
        <div class="hint-card">
          <p>Choose a folder of pre-rendered page images (from rasterize-pdf.py) to view it as an interactive flipbook.</p>
          <button id="btnLoad2" class="tbtn primary"><span class="label">Choose Folder</span></button>
          <p class="hint-sub">or drag &amp; drop the page images anywhere on this page</p>
        </div>
      </div>

      <div id="viewport">
        <div id="zoomLayer" class="animated">
          <div id="flipbook"></div>
          <canvas id="penCanvas"></canvas>
        </div>
      </div>

      <button id="navPrev" class="nav-arrow left" aria-label="Previous page">‹</button>
      <button id="navNext" class="nav-arrow right" aria-label="Next page">›</button>

      <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <div id="loadingText">Loading…</div>
      </div>
    </main>
  </div>

  <!-- ============ Vendor library (embedded for offline / file:// use) ============ -->

  <!-- StPageFlip (page-turn UI) -->

  // self-contained flipbook. Left null in this master template, in which
  // case the file-picker/drag-drop path below is used instead (handy for
  // testing the viewer itself against a rasterize-pdf.py output folder
  // without running the packaging step).
  // ---------------------------------------------------------------------
  var EMBEDDED_MANIFEST = /*__PAGE_MANIFEST__*/ null;

  // ---------------------------------------------------------------------
  // DOM references
  // ---------------------------------------------------------------------
  var fileInput = document.getElementById('fileInput');
  var btnLoad = document.getElementById('btnLoad');
  var btnLoad2 = document.getElementById('btnLoad2');
  var dropHint = document.getElementById('dropHint');
  var toolbar = document.getElementById('toolbar');
  var stage = document.getElementById('stage');
  var viewportEl = document.getElementById('viewport');
  var zoomLayer = document.getElementById('zoomLayer');
  var flipbookEl = document.getElementById('flipbook');
  var pageJumpInput = document.getElementById('pageJumpInput');
  var pageTotalLabel = document.getElementById('pageTotalLabel');
  var btnRestart = document.getElementById('btnRestart');
  var navPrev = document.getElementById('navPrev');
  var navNext = document.getElementById('navNext');
  var btnZoomIn = document.getElementById('btnZoomIn');
  var btnZoomOut = document.getElementById('btnZoomOut');
  var btnZoomReset = document.getElementById('btnZoomReset');
  var loadingOverlay = document.getElementById('loadingOverlay');
  var loadingText = document.getElementById('loadingText');
  var penCanvas = document.getElementById('penCanvas');
  var penCtx = penCanvas.getContext('2d');
  var btnPenToggle = document.getElementById('btnPenToggle');
  var btnPenWeight = document.getElementById('btnPenWeight');

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var pageFlip = null;
  var numPages = 0;
  var currentIndex = 0; // 0-based, from StPageFlip
  var pageAspect = 1;   // single page image width/height
  var isPreMadeSpread = false; // true when each page image already contains two facing pages
  var spreadStep = 2;   // how many page images one flip advances
  var pageImages = [];       // [{src, w, h}, ...], 0-indexed
  var pageImgMap = new Map(); // pageNumber(1-based) -> <img> element

  // No pdf.js, no live rendering, no per-page canvas sizing math, no
  // warm-up/eviction/memory-budget scheme, no pathological-page guard —
  // every page here is a plain pre-rendered image, already embedded (or
  // already read into a data: URI by the file picker) before the book is
  // ever built. The browser decodes a JPEG in milliseconds regardless of
  // how complex the original vector art was; there is no render step left
  // to be slow. See NEXT-STEPS.md / CHANGELOG.md in this repo for why this
  // viewer exists alongside the live-PDF one (index-pen.html).

  // ---------------------------------------------------------------------
  // Pen tool: a stroke-history annotation overlay for live presentations.
  // Ink lives on #penCanvas (a sibling of #zoomLayer, see the CSS comment)
  // and clears automatically on any page change — see onPageChanged().
  // Strokes are stored as fractional (0..1) coordinates relative to the
  // canvas's own CSS box rather than absolute pixels, so a resize mid-
  // annotation (window resize, or toggling pen mode after a zoom change)
  // redraws them in the right place instead of the wrong scale/position.
  // ---------------------------------------------------------------------
  var penMode = false;
  // A nice, legible navy blue — used only when a page has no meaningful
  // chromatic content for detectDominantColor() to match (pencil sketches,
  // plain text). Was green (#22c55e); changed on request.
  var DEFAULT_PEN_COLOR = '#1e3a8a';
  var PEN_COLOR = DEFAULT_PEN_COLOR;
  var PEN_WEIGHTS = { thin: 2.5, thick: 6 };
  var penWeightName = 'thin';
  var strokeHistory = [];  // { color, width, points: [{fx,fy}, ...] }[]
  var currentStroke = null;
  var penPointerId = null;

  var MIN_ZOOM = 1;
  var MAX_ZOOM = 4;
  var ZOOM_STEP = 1.5;
  var zoom = 1;
  var panX = 0, panY = 0;
  var recenterOffsetPx = 0; // shifts a lone cover/back-cover page to screen center

  var renderDebounceTimer = null;
  var resizeDebounceTimer = null;

  var VIEWPORT_PADDING = 28; // keep in sync with #viewport padding above

  // Fit #flipbook to an *exact* pixel box inside #viewport, preserving the
  // real page aspect ratio. StPageFlip's flipNext()/flipPrev() (the real
  // animated page-turn) simulate a corner-drag using a hardcoded coordinate
  // that assumes the book sits flush at the container's left edge —
  // whenever there's leftover centering slack, that guess misses the page
  // and flipPrev() silently does nothing. Sizing the container to an exact
  // multiple of one page's width (worked out from StPageFlip's own internal
  // centering formula, which differs by mode) keeps that offset at zero.
  function layoutBookContainer() {
    if (!numPages) return;
    var availW = viewportEl.clientWidth - VIEWPORT_PADDING * 2;
    var availH = viewportEl.clientHeight - VIEWPORT_PADDING * 2;
    if (availW <= 0 || availH <= 0) return;

    var targetAspect = pageAspect * (isPreMadeSpread ? 3 : 2);
    var w, h;
    if (availW / availH > targetAspect) {
      h = availH;
      w = h * targetAspect;
    } else {
      w = availW;
      h = w / targetAspect;
    }
    flipbookEl.style.width = Math.round(w) + 'px';
    flipbookEl.style.height = Math.round(h) + 'px';
    syncPenCanvasBox();
  }

  // ---------------------------------------------------------------------
  // Pen tool
  // ---------------------------------------------------------------------
  function syncPenCanvasBox() {
    if (!flipbookEl || !flipbookEl.parentNode) return;
    var w = flipbookEl.clientWidth, h = flipbookEl.clientHeight;
    if (w < 1 || h < 1) return;

    var dpr = window.devicePixelRatio || 1;
    penCanvas.width = Math.round(w * dpr);
    penCanvas.height = Math.round(h * dpr);
    penCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';

    redrawStrokes();
  }

  function strokeToPixelPoints(stroke) {
    var w = penCanvas.clientWidth, h = penCanvas.clientHeight;
    return stroke.points.map(function (p) { return { x: p.fx * w, y: p.fy * h }; });
  }

  function drawStroke(stroke) {
    var pts = strokeToPixelPoints(stroke);
    if (pts.length < 1) return;
    penCtx.strokeStyle = stroke.color;
    penCtx.lineWidth = stroke.width;
    penCtx.beginPath();
    penCtx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 1) {
      penCtx.lineTo(pts[0].x + 0.01, pts[0].y + 0.01);
    } else {
      for (var i = 1; i < pts.length; i++) penCtx.lineTo(pts[i].x, pts[i].y);
    }
    penCtx.stroke();
  }

  function redrawStrokes() {
    penCtx.clearRect(0, 0, penCanvas.clientWidth, penCanvas.clientHeight);
    strokeHistory.forEach(drawStroke);
  }

  function clearInk() {
    strokeHistory = [];
    currentStroke = null;
    penCtx.clearRect(0, 0, penCanvas.clientWidth, penCanvas.clientHeight);
  }

  function undoLastStroke() {
    if (!strokeHistory.length) return;
    strokeHistory.pop();
    redrawStrokes();
  }

  var PEN_INACTIVITY_MS = 10000;
  var penInactivityTimer = null;

  function clearPenInactivityTimer() {
    clearTimeout(penInactivityTimer);
    penInactivityTimer = null;
  }

  function armPenInactivityTimer() {
    clearTimeout(penInactivityTimer);
    penInactivityTimer = setTimeout(function () { setPenMode(false); }, PEN_INACTIVITY_MS);
  }

  function setPenMode(on) {
    if (penMode === on) return;
    penMode = on;
    penCanvas.classList.toggle('pen-active', on);
    btnPenToggle.classList.toggle('active', on);
    if (on) {
      syncPenCanvasBox();
      armPenInactivityTimer();
    } else {
      clearPenInactivityTimer();
    }
  }

  function penPointFromEvent(e) {
    var rect = penCanvas.getBoundingClientRect();
    return { fx: (e.clientX - rect.left) / rect.width, fy: (e.clientY - rect.top) / rect.height };
  }

  penCanvas.addEventListener('pointerdown', function (e) {
    if (!penMode || penPointerId !== null) return;
    armPenInactivityTimer();
    penPointerId = e.pointerId;
    try { penCanvas.setPointerCapture(e.pointerId); } catch (err) {}
    currentStroke = { color: PEN_COLOR, width: PEN_WEIGHTS[penWeightName], points: [penPointFromEvent(e)] };
  });

  penCanvas.addEventListener('pointermove', function (e) {
    if (e.pointerId !== penPointerId || !currentStroke) return;
    armPenInactivityTimer();
    currentStroke.points.push(penPointFromEvent(e));
    var pts = strokeToPixelPoints(currentStroke);
    var n = pts.length;
    if (n < 2) return;
    penCtx.strokeStyle = currentStroke.color;
    penCtx.lineWidth = currentStroke.width;
    penCtx.beginPath();
    penCtx.moveTo(pts[n - 2].x, pts[n - 2].y);
    penCtx.lineTo(pts[n - 1].x, pts[n - 1].y);
    penCtx.stroke();
  });

  function endPenStroke(e) {
    if (e.pointerId !== penPointerId) return;
    armPenInactivityTimer();
    try { penCanvas.releasePointerCapture(e.pointerId); } catch (err) {}
    penPointerId = null;
    if (currentStroke) {
      if (currentStroke.points.length === 1) drawStroke(currentStroke);
      strokeHistory.push(currentStroke);
      currentStroke = null;
    }
  }
  penCanvas.addEventListener('pointerup', endPenStroke);
  penCanvas.addEventListener('pointercancel', endPenStroke);

  btnPenToggle.addEventListener('click', function () { setPenMode(!penMode); });

  btnPenWeight.addEventListener('click', function () {
    penWeightName = penWeightName === 'thin' ? 'thick' : 'thin';
    btnPenWeight.textContent = penWeightName === 'thin' ? 'Thin' : 'Thick';
  });

  window.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 'z' || e.key === 'Z')) {
      if (!strokeHistory.length) return;
      e.preventDefault();
      undoLastStroke();
      return;
    }
    if (!mod && (e.key === 'p' || e.key === 'P')) {
      if (!numPages) return;
      e.preventDefault();
      setPenMode(!penMode);
    }
  });

  // ---------------------------------------------------------------------
  // Loading overlay helpers
  // ---------------------------------------------------------------------
  function showLoading(msg) {
    loadingText.textContent = msg || 'Loading…';
    loadingOverlay.classList.remove('hidden');
  }
  function hideLoading() {
    loadingOverlay.classList.add('hidden');
  }

  // ---------------------------------------------------------------------
  // File / folder selection (dev/testing path — the packaged output uses
  // EMBEDDED_MANIFEST instead, see bottom of file)
  // ---------------------------------------------------------------------
  btnLoad.addEventListener('click', function () { fileInput.click(); });
  btnLoad2.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function (e) {
    if (e.target.files && e.target.files.length) loadImageFiles(e.target.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (evt) {
    stage.addEventListener(evt, function (e) { e.preventDefault(); e.stopPropagation(); });
  });
  stage.addEventListener('drop', function (e) {
    e.preventDefault();
    e.stopPropagation();
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) loadImageFiles(files);
  });

  function isImageFile(f) { return /\.(jpe?g|png|webp)$/i.test(f.name); }

  function readImageFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          resolve({ src: reader.result, w: img.naturalWidth, h: img.naturalHeight });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function loadImageFiles(fileList) {
    var files = Array.prototype.filter.call(fileList, isImageFile);
    if (!files.length) {
      alert('Please choose the page images produced by rasterize-pdf.py.');
      return;
    }
    // Filenames are zero-padded sequential ("page-01.jpg", ...) by
    // rasterize-pdf.py, so a plain lexicographic sort puts them in order.
    files.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    showLoading('Reading ' + files.length + ' images…');
    Promise.all(files.map(readImageFile)).then(function (images) {
      initBookFromImages(images);
    }).catch(function (err) {
      console.error(err);
      hideLoading();
      alert('Could not read one or more of these images.');
    });
  }

  // ---------------------------------------------------------------------
  // Building / resetting the flipbook for a newly loaded set of pages
  // ---------------------------------------------------------------------
  function destroyCurrentBook() {
    if (pageFlip) {
      try { pageFlip.destroy(); } catch (e) { /* older builds may lack destroy() */ }
      pageFlip = null;
    }
    // StPageFlip's destroy() removes the element it was constructed on from
    // the DOM (not just its children) — relying on the original #flipbook
    // node surviving a load/swap cycle silently breaks loading a second book
    // (it renders into a detached, invisible node). Always start the next
    // book on a fresh element instead.
    var freshFlipbook = document.createElement('div');
    freshFlipbook.id = 'flipbook';
    if (flipbookEl.parentNode) {
      flipbookEl.parentNode.replaceChild(freshFlipbook, flipbookEl);
    } else {
      zoomLayer.appendChild(freshFlipbook);
    }
    flipbookEl = freshFlipbook;
    pageImgMap.clear();
    pageImages = [];
    numPages = 0;
    currentIndex = 0;
    resetZoomState();
    setPenMode(false);
    clearInk();
  }

  function buildPageElements(images) {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < images.length; i++) {
      var page = document.createElement('div');
      page.className = 'pf-page';
      page.dataset.pageNumber = String(i + 1);
      // "hard" density skips StPageFlip's realistic paper-curl animation,
      // which (per its own source) works by cloning the whole page element
      // -- including a fresh <img> that has to redecode -- for the
      // duration of the flip. That clone/redecode was confirmed as the
      // cause of page images visibly flashing in during a flip; "hard"
      // density flips the page as a simple rigid rotation on the original
      // element instead, no clone, at the cost of the bendy-paper look.
      page.dataset.density = 'hard';

      var inner = document.createElement('div');
      inner.className = 'pf-page-inner';

      var img = document.createElement('img');
      img.className = 'page-img';
      img.decoding = 'async';
      img.draggable = false;
      img.alt = 'Page ' + (i + 1);
      // img.dataset.src is the DISPLAY tier (smaller, always used for
      // ordinary flipping) and img.dataset.zoomSrc is the ZOOM tier
      // (full-res, swapped in only for the page(s) actually on screen once
      // zoom > 1 -- see updateVisibleImageTier()). Deliberately not
      // assigning either as the real `src` here -- see updateImageWindow().
      // Assigning every page's image immediately at build time (the
      // original approach) made the browser decode and hold ALL pages in
      // memory at once; that, not DPI itself, is what caused laggy flips --
      // a bigger per-page image just made a bad architecture worse.
      img.dataset.src = images[i].src;
      img.dataset.zoomSrc = images[i].zoomSrc;
      pageImgMap.set(i + 1, img);

      inner.appendChild(img);
      page.appendChild(inner);
      frag.appendChild(page);
    }
    flipbookEl.appendChild(frag);
  }

  function initBookFromImages(images) {
    destroyCurrentBook();
    if (!images || !images.length) { hideLoading(); return; }
    pageImages = images;
    numPages = images.length;

    var first = images[0];
    var aspect = first.w / first.h;

    // Some portfolio/export tools bake TWO facing pages into a single wide
    // image (a pre-made spread) rather than exporting individual pages. If
    // we then also pair up two of those images side by side, you get 4
    // sub-pages crammed into view instead of 2. Detect this from the
    // image's own aspect ratio and show one image at a time instead of
    // pairing two. Same threshold as index-pen.html's landscape-PDF fix —
    // deliberately above a genuine landscape single page's aspect (e.g.
    // 11x8.5in = 1.29) and below an actual pre-combined two-page spread's
    // (~1.55, two portrait pages side by side).
    pageAspect = aspect;
    isPreMadeSpread = aspect > 1.42;
    spreadStep = isPreMadeSpread ? 1 : 2;

    var baseHeight = 900;
    var baseWidth = Math.round(baseHeight * aspect);

    buildPageElements(images);
    updateImageWindow(0);
    layoutBookContainer();

    pageFlip = new PageFlip(flipbookEl, {
      width: baseWidth,
      height: baseHeight,
      size: 'stretch',
      autoSize: false,
      minWidth: isPreMadeSpread ? 9000 : 200,
      maxWidth: isPreMadeSpread ? 12000 : 2200,
      minHeight: 250,
      maxHeight: 2800,
      usePortrait: isPreMadeSpread ? true : false,
      maxShadowOpacity: 0.5,
      showCover: !isPreMadeSpread,
      mobileScrollSupport: false,
      useMouseEvents: false,
      disableFlipByClick: true,
      drawShadow: true,
      flippingTime: 350
    });

    pageFlip.loadFromHTML(flipbookEl.querySelectorAll('.pf-page'));

    pageFlip.on('flip', function (e) {
      currentIndex = e.data;
      onPageChanged();
    });

    currentIndex = 0;
    dropHint.classList.add('hidden');
    onPageChanged();
    hideLoading();
  }

  function updateRecenterOffset() {
    if (isPreMadeSpread) { recenterOffsetPx = 0; return; }
    var quarterWidth = flipbookEl.getBoundingClientRect().width / 4;
    var isLoneBackCover = currentIndex === numPages - 1 && numPages % 2 === 0;
    if (currentIndex === 0) {
      recenterOffsetPx = -quarterWidth;
    } else if (isLoneBackCover) {
      recenterOffsetPx = quarterWidth;
    } else {
      recenterOffsetPx = 0;
    }
  }

  // ---------------------------------------------------------------------
  // Pen color auto-match: sample the currently visible page image(s) and
  // pick pen ink to match the most prominent *bright, vivid* color on the
  // page, so e.g. a page with a bright red accent gets red ink even if a
  // duller color (dark brown wood tones, shadows, etc.) covers more pixels.
  // ---------------------------------------------------------------------
  var PEN_SAMPLE_SIZE = 48;
  var HUE_BUCKETS = 24; // 15° each

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h = 0, s = 0, l = (max + min) / 2;
    var d = max - min;
    if (d !== 0) {
      s = d / (1 - Math.abs(2 * l - 1));
      switch (max) {
        case r: h = 60 * (((g - b) / d) % 6); break;
        case g: h = 60 * ((b - r) / d + 2); break;
        case b: h = 60 * ((r - g) / d + 4); break;
      }
      if (h < 0) h += 360;
    }
    return { h: h, s: s, l: l };
  }

  function hslToRgb(h, s, l) {
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return {
      r: Math.round((r + m) * 255),
      g: Math.round((g + m) * 255),
      b: Math.round((b + m) * 255)
    };
  }

  function toHex(n) { return n.toString(16).padStart(2, '0'); }

  // Returns a hex color for the most prominent *bright, vivid* hue on the
  // given images, or null if the page has no meaningfully colorful content
  // (e.g. a pure pencil-sketch page), so the caller can fall back to
  // DEFAULT_PEN_COLOR.
  //
  // Selection favors brightness over raw pixel count: each qualifying hue
  // bucket is scored by avg-lightness * avg-saturation ("vividness"), not
  // by how many pixels landed in it. Without this, a small dull-brown
  // dominant region (wood tones, shadows) could win over a smaller but
  // genuinely vivid accent color just by covering more area — the opposite
  // of what a presenter wants from an auto-matched pen color. The pixel
  // filter itself also has a higher lightness floor than a plain
  // "not-near-black" cutoff would need, specifically to keep dark/muted
  // tones (dark brown, olive, etc.) out of consideration entirely rather
  // than just being outscored.
  function detectDominantColor(images) {
    var buckets = [];
    for (var i = 0; i < HUE_BUCKETS; i++) buckets.push({ count: 0, r: 0, g: 0, b: 0 });
    var off = document.createElement('canvas');
    off.width = PEN_SAMPLE_SIZE;
    off.height = PEN_SAMPLE_SIZE;
    var octx = off.getContext('2d', { willReadFrequently: true });
    var sawChroma = false;

    images.forEach(function (img) {
      if (!img || !img.naturalWidth || !img.naturalHeight) return;
      octx.clearRect(0, 0, PEN_SAMPLE_SIZE, PEN_SAMPLE_SIZE);
      octx.drawImage(img, 0, 0, PEN_SAMPLE_SIZE, PEN_SAMPLE_SIZE);
      var data;
      try { data = octx.getImageData(0, 0, PEN_SAMPLE_SIZE, PEN_SAMPLE_SIZE).data; }
      catch (e) { return; } // tainted canvas or similar — just skip it
      for (var p = 0; p < data.length; p += 4) {
        var a = data[p + 3];
        if (a < 200) continue;
        var r = data[p], g = data[p + 1], b = data[p + 2];
        var hsl = rgbToHsl(r, g, b);
        // s < 0.35: not saturated enough to be a "color" (paper, ink lines,
        // shadows). l < 0.20 or l > 0.93: too dark or too light-washed to
        // ever read as a bright color, regardless of saturation — this is
        // what keeps dark/muted tones like dark brown out of contention
        // structurally, not just by being outscored below.
        if (hsl.s < 0.35 || hsl.l > 0.93 || hsl.l < 0.20) continue;
        var idx = Math.floor(hsl.h / (360 / HUE_BUCKETS)) % HUE_BUCKETS;
        var bucket = buckets[idx];
        bucket.count++;
        bucket.r += r; bucket.g += g; bucket.b += b;
        sawChroma = true;
      }
    });

    if (!sawChroma) return null;

    var best = null, bestScore = -1;
    for (var j = 0; j < buckets.length; j++) {
      var bucket = buckets[j];
      if (bucket.count < 6) continue; // too little of this hue to be meaningful, not noise
      var avgR = bucket.r / bucket.count, avgG = bucket.g / bucket.count, avgB = bucket.b / bucket.count;
      var avgHsl = rgbToHsl(avgR, avgG, avgB);
      var score = avgHsl.l * avgHsl.s; // vividness: rewards bright AND saturated together
      if (score > bestScore) { bestScore = score; best = { hsl: avgHsl }; }
    }
    if (!best) return null;

    // Clamp the *output ink color's* lightness into a legible band — this
    // is separate from the selection above (which already picked the most
    // vivid hue present): a very pale detected hue would otherwise render
    // as near-invisible ink on white paper, and this keeps the matched hue
    // while making sure the pen actually shows up.
    var legibleL = Math.min(Math.max(best.hsl.l, 0.32), 0.58);
    var rgb = hslToRgb(best.hsl.h, Math.max(best.hsl.s, 0.55), legibleL);
    return '#' + toHex(rgb.r) + toHex(rgb.g) + toHex(rgb.b);
  }

  // Pages currently on-screen (not StPageFlip's display:none siblings) —
  // used for color sampling; matches whatever the reader is looking at
  // right now, spread or single page alike.
  function getVisiblePageImages() {
    var pfPages = flipbookEl.querySelectorAll('.pf-page');
    var visible = [];
    for (var i = 0; i < pfPages.length; i++) {
      var rect = pfPages[i].getBoundingClientRect();
      if (rect.width > 2 && rect.height > 2) {
        var img = pfPages[i].querySelector('img');
        if (img && img.complete && img.naturalWidth) visible.push(img);
      }
    }
    return visible;
  }

  // detectDominantColor's canvas downscale of a multi-megapixel source
  // image is genuinely expensive (confirmed: reproducibly stalls the main
  // thread for the better part of a second) -- calling it synchronously
  // from onPageChanged(), which fires right as the flip animation settles,
  // is what made flips visibly hang right at the end. Deferring it past
  // the current frame (setTimeout(...,0)) lets the just-finished flip
  // actually paint before the expensive work runs, and caching per page
  // means it only ever pays that cost once per page for the life of the
  // session, not on every single revisit.
  var penColorCache = {};

  function updatePenColorForCurrentPage() {
    if (penColorCache.hasOwnProperty(currentIndex)) {
      PEN_COLOR = penColorCache[currentIndex];
      return;
    }
    var indexAtCall = currentIndex;
    window.setTimeout(function () {
      var detected = detectDominantColor(getVisiblePageImages());
      var color = detected || DEFAULT_PEN_COLOR;
      penColorCache[indexAtCall] = color;
      if (currentIndex === indexAtCall) PEN_COLOR = color;
    }, 0);
  }

  function updatePageIndicator() {
    if (!numPages) {
      pageJumpInput.value = '';
      pageTotalLabel.textContent = 'of –';
      return;
    }
    pageJumpInput.max = String(numPages);
    if (document.activeElement !== pageJumpInput) {
      pageJumpInput.value = String(currentIndex + 1);
    }
    pageTotalLabel.textContent = 'of ' + numPages;
  }

  function isAtEnd() {
    if (isPreMadeSpread) return currentIndex >= numPages - 1;
    return currentIndex >= numPages - 2;
  }

  function updateNavButtons() {
    var atEnd = isAtEnd();
    navPrev.disabled = currentIndex <= 0;
    navNext.disabled = atEnd;
    btnRestart.classList.toggle('hidden', !atEnd);
  }

  // ---------------------------------------------------------------------
  // Image windowing: only the current page +/- IMAGE_WINDOW_RADIUS keeps
  // its display-tier <img src> assigned (and therefore decoded/resident in
  // memory); everything else has its src cleared. Without this, a
  // multi-hundred-page PDF would hold every page's bitmap in memory at
  // once regardless of DPI. Radius 3 (7 pages resident) comfortably covers
  // a two-page-spread flip's outgoing+incoming pages with room to spare.
  //
  // Loading (for pages entering the window) always happens immediately --
  // the target page must be ready before/as the flip animation starts.
  // Eviction (for pages leaving the window) is deliberately DEFERRED past
  // FLIP_SETTLE_MS: removing an <img src> while StPageFlip's CSS transform
  // was still actively running on nearby page elements was reproduced as a
  // hung/stuck-looking flip animation. Waiting until well after the
  // animation has settled avoids touching the DOM mid-transition.
  // ---------------------------------------------------------------------
  var IMAGE_WINDOW_RADIUS = 3;
  var FLIP_SETTLE_MS = 450; // > the 350ms flippingTime passed to `new PageFlip(...)`
  var evictTimer = null;

  function loadWindow(centerIndex0Based) {
    var lo = centerIndex0Based - IMAGE_WINDOW_RADIUS;
    var hi = centerIndex0Based + IMAGE_WINDOW_RADIUS;
    for (var i = Math.max(0, lo); i <= Math.min(numPages - 1, hi); i++) {
      var img = pageImgMap.get(i + 1);
      if (img && !img.getAttribute('src')) img.src = img.dataset.src;
    }
  }

  function evictOutsideWindow(centerIndex0Based) {
    var lo = centerIndex0Based - IMAGE_WINDOW_RADIUS;
    var hi = centerIndex0Based + IMAGE_WINDOW_RADIUS;
    for (var i = 0; i < numPages; i++) {
      if (i >= lo && i <= hi) continue;
      var img = pageImgMap.get(i + 1);
      if (img && img.getAttribute('src')) img.removeAttribute('src'); // frees the decoded bitmap
    }
  }

  function updateImageWindow(centerIndex0Based) {
    loadWindow(centerIndex0Based);
    window.clearTimeout(evictTimer);
    evictTimer = window.setTimeout(function () { evictOutsideWindow(centerIndex0Based); }, FLIP_SETTLE_MS);
  }

  // ---------------------------------------------------------------------
  // Zoom-tier swap: the page(s) actually on screen show their DISPLAY-tier
  // image (dataset.src) normally, and swap to the full-res ZOOM tier
  // (dataset.zoomSrc) only while zoom > 1 -- see updateZoomUi(). This is
  // what keeps ordinary flipping cheap (small images) while still giving
  // real crispness on demand (only 1-2 pages ever pay the full-res cost).
  // ---------------------------------------------------------------------
  function setPageImageTier(pageNumber1Based, useZoomTier) {
    var img = pageImgMap.get(pageNumber1Based);
    if (!img) return;
    var wantSrc = useZoomTier ? img.dataset.zoomSrc : img.dataset.src;
    if (wantSrc && img.getAttribute('src') !== wantSrc) img.src = wantSrc;
  }

  function updateVisibleImageTier() {
    var useZoom = zoom > 1;
    setPageImageTier(currentIndex + 1, useZoom);
    setPageImageTier(currentIndex + 2, useZoom);
  }

  function onPageChanged() {
    clearInk(); // every page-change path (flip event, instant jump) runs through here
    updateImageWindow(currentIndex); // safety net -- the real pre-warm happens before the flip starts, see flipNext/flipPrev/instantGoToIndex
    updateRecenterOffset();
    resetZoomState();
    syncPenCanvasBox();
    updatePageIndicator();
    updateNavButtons();
    updatePenColorForCurrentPage();
  }

  // ---------------------------------------------------------------------
  // Flip navigation (click / tap / buttons / jump-to-page)
  // ---------------------------------------------------------------------
  var isTouchPrimary = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  function instantGoToIndex(targetIndex0Based) {
    if (!pageFlip || !numPages) return;
    var target = Math.max(0, Math.min(numPages - 1, targetIndex0Based));
    updateImageWindow(target);
    if (zoom !== 1) resetZoomState();
    flipbookEl.classList.add('flipping');
    pageFlip.turnToPage(target);
    currentIndex = pageFlip.getCurrentPageIndex();
    onPageChanged();
    requestAnimationFrame(function () {
      flipbookEl.classList.remove('flipping');
    });
  }

  function flipNext() {
    if (!pageFlip || isAtEnd()) return;
    clearInk();
    if (isTouchPrimary) { instantGoToIndex(currentIndex + spreadStep); return; }
    updateImageWindow(currentIndex + spreadStep);
    if (zoom !== 1) resetZoomState();
    pageFlip.flipNext();
  }
  function flipPrev() {
    if (!pageFlip || currentIndex <= 0) return;
    clearInk();
    if (isTouchPrimary) { instantGoToIndex(currentIndex - spreadStep); return; }
    updateImageWindow(currentIndex - spreadStep);
    if (zoom !== 1) resetZoomState();
    pageFlip.flipPrev();
  }
  navNext.addEventListener('click', flipNext);
  navPrev.addEventListener('click', flipPrev);

  function goToPage(pageNumber1Based) {
    instantGoToIndex(Math.round(pageNumber1Based) - 1);
  }

  var jumpHandledByEnter = false;
  pageJumpInput.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var val = parseInt(pageJumpInput.value, 10);
    if (!isNaN(val)) goToPage(val);
    jumpHandledByEnter = true;
    pageJumpInput.blur();
  });
  pageJumpInput.addEventListener('blur', function () {
    if (jumpHandledByEnter) { jumpHandledByEnter = false; return; }
    var val = parseInt(pageJumpInput.value, 10);
    if (!isNaN(val)) goToPage(val);
    else updatePageIndicator();
  });

  btnRestart.addEventListener('click', function () { goToPage(1); });

  // ---------------------------------------------------------------------
  // Zoom core
  // ---------------------------------------------------------------------
  function clampPan(z) {
    var rect = viewportEl.getBoundingClientRect();
    var maxX = (rect.width * (z - 1)) / 2;
    var maxY = (rect.height * (z - 1)) / 2;
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }

  function applyTransform() {
    zoomLayer.style.transform = 'translate(' + (panX + recenterOffsetPx) + 'px,' + panY + 'px) scale(' + zoom + ')';
  }

  function resetZoomState() {
    zoom = 1; panX = 0; panY = 0;
    zoomLayer.classList.remove('dragging');
    zoomLayer.classList.add('animated');
    applyTransform();
    updateZoomUi();
  }

  function updateZoomUi() {
    btnZoomReset.textContent = Math.round(zoom * 100) + '%';
    btnZoomOut.disabled = zoom <= MIN_ZOOM + 0.001;
    btnZoomIn.disabled = zoom >= MAX_ZOOM - 0.001;
    viewportEl.classList.toggle('zoomed', zoom > 1);
    updateVisibleImageTier();
  }

  function setZoom(newZoom, animate) {
    if (!numPages) return;
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if (newZoom === zoom) return;
    zoom = newZoom;
    clampPan(zoom);
    zoomLayer.classList.toggle('animated', !!animate);
    applyTransform();
    updateZoomUi();
  }

  function zoomBy(factor, animate) {
    setZoom(zoom * factor, animate !== false);
  }

  function zoomAtClientPoint(newZoom, clientX, clientY, animate) {
    if (!numPages) return;
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if (newZoom === zoom) return;

    if (newZoom <= MIN_ZOOM + 0.0001) {
      panX = 0;
      panY = 0;
    } else {
      var rect = viewportEl.getBoundingClientRect();
      var cx = clientX - (rect.left + rect.width / 2);
      var cy = clientY - (rect.top + rect.height / 2);
      var r = newZoom / zoom;
      panX = (cx - recenterOffsetPx) * (1 - r) + r * panX;
      panY = cy * (1 - r) + r * panY;
    }

    zoom = newZoom;
    clampPan(zoom);
    zoomLayer.classList.toggle('animated', !!animate);
    applyTransform();
    updateZoomUi();
  }

  btnZoomIn.addEventListener('click', function () { zoomBy(ZOOM_STEP, true); });
  btnZoomOut.addEventListener('click', function () { zoomBy(1 / ZOOM_STEP, true); });
  btnZoomReset.addEventListener('click', function () {
    zoom = 1; panX = 0; panY = 0;
    zoomLayer.classList.add('animated');
    applyTransform();
    updateZoomUi();
  });

  // ---------------------------------------------------------------------
  // Keyboard shortcuts: Ctrl/Cmd + / - / 0 zoom the flipbook, not the page
  // ---------------------------------------------------------------------
  window.addEventListener('keydown', function (e) {
    if (penMode) return;
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') {
      e.preventDefault();
      zoomBy(ZOOM_STEP, true);
    } else if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract') {
      e.preventDefault();
      zoomBy(1 / ZOOM_STEP, true);
    } else if (e.key === '0' || e.code === 'Numpad0') {
      e.preventDefault();
      btnZoomReset.click();
    }
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (!numPages) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      flipNext();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      flipPrev();
    }
  });

  viewportEl.addEventListener('wheel', function (e) {
    if (!numPages || penMode) return;
    if (e.ctrlKey) {
      e.preventDefault();
      var factor = Math.exp(-e.deltaY * 0.01);
      zoomAtClientPoint(zoom * factor, e.clientX, e.clientY, false);
      return;
    }
    if (zoom > 1) {
      e.preventDefault();
      panX -= e.deltaX;
      panY -= e.deltaY;
      clampPan(zoom);
      zoomLayer.classList.remove('animated');
      applyTransform();
    }
  }, { passive: false });

  var gestureStartZoom = 1;
  document.addEventListener('gesturestart', function (e) {
    if (penMode) return;
    e.preventDefault();
    gestureStartZoom = zoom;
  });
  document.addEventListener('gesturechange', function (e) {
    if (penMode) return;
    e.preventDefault();
    if (!numPages) return;
    zoomAtClientPoint(gestureStartZoom * e.scale, e.clientX, e.clientY, false);
  });
  document.addEventListener('gestureend', function (e) {
    if (penMode) return;
    e.preventDefault();
  });

  // ---------------------------------------------------------------------
  // Unified pointer handling: tap-to-flip, pinch-to-zoom, drag-to-pan
  // ---------------------------------------------------------------------
  var pointers = new Map();
  var pinch = null;
  var pan = null;
  var tap = null;
  var TAP_MOVE_THRESHOLD = 10;
  var TAP_TIME_THRESHOLD = 400;

  function pointerArray() {
    return Array.from(pointers.values());
  }

  function distanceAndCenter(pts) {
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return {
      dist: Math.sqrt(dx * dx + dy * dy),
      cx: (pts[0].x + pts[1].x) / 2,
      cy: (pts[0].y + pts[1].y) / 2
    };
  }

  viewportEl.addEventListener('pointerdown', function (e) {
    if (!numPages || penMode) return;
    try { viewportEl.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    zoomLayer.classList.remove('animated');
    zoomLayer.classList.add('dragging');

    if (pointers.size === 1) {
      tap = { x: e.clientX, y: e.clientY, t: Date.now(), moved: false };
      if (zoom > 1) {
        pan = { startX: e.clientX, startY: e.clientY, startPanX: panX, startPanY: panY };
      } else {
        pan = null;
      }
    } else if (pointers.size === 2) {
      tap = null;
      pan = null;
      var pts = pointerArray();
      var dc = distanceAndCenter(pts);
      pinch = { startDist: dc.dist, startZoom: zoom, startPanX: panX, startPanY: panY };
    }
  });

  viewportEl.addEventListener('pointermove', function (e) {
    if (penMode || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2 && pinch) {
      var pts = pointerArray();
      var dc = distanceAndCenter(pts);
      var newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinch.startZoom * (dc.dist / pinch.startDist)));
      zoom = newZoom;
      clampPan(zoom);
      applyTransform();
      updateZoomUi();
      if (tap) tap.moved = true;
    } else if (pointers.size === 1 && pan) {
      var dx = e.clientX - pan.startX;
      var dy = e.clientY - pan.startY;
      panX = pan.startPanX + dx;
      panY = pan.startPanY + dy;
      clampPan(zoom);
      applyTransform();
      if (tap && (Math.abs(dx) > TAP_MOVE_THRESHOLD || Math.abs(dy) > TAP_MOVE_THRESHOLD)) tap.moved = true;
    } else if (pointers.size === 1 && tap) {
      var mdx = e.clientX - tap.x, mdy = e.clientY - tap.y;
      if (Math.abs(mdx) > TAP_MOVE_THRESHOLD || Math.abs(mdy) > TAP_MOVE_THRESHOLD) tap.moved = true;
    }
  });

  function endPointer(e) {
    var wasPinching = pointers.size === 2;
    pointers.delete(e.pointerId);

    if (pointers.size < 2 && pinch) {
      pinch = null;
    }

    if (pointers.size === 0) {
      zoomLayer.classList.remove('dragging');
      zoomLayer.classList.add('animated');

      if (!wasPinching && pan) {
        pan = null;
      } else if (tap && !tap.moved && zoom === 1 && (Date.now() - tap.t) < TAP_TIME_THRESHOLD) {
        var rect = viewportEl.getBoundingClientRect();
        var relX = tap.x - rect.left;
        if (relX < rect.width / 2) {
          flipPrev();
        } else {
          flipNext();
        }
      }
      tap = null;
      pan = null;
    }
  }

  viewportEl.addEventListener('pointerup', endPointer);
  viewportEl.addEventListener('pointercancel', endPointer);

  // ---------------------------------------------------------------------
  // Resize handling: re-fit #flipbook's exact size. No re-render needed —
  // unlike the live-PDF viewer, page images are already at their full
  // native (rasterize-pdf.py) resolution and the browser just rescales
  // them via CSS, cheaply, regardless of window size or zoom level.
  // ---------------------------------------------------------------------
  window.addEventListener('resize', function () {
    if (pageFlip) layoutBookContainer();
  });

  // ---------------------------------------------------------------------
  // Prevent the whole document from being zoomed/scrolled by stray gestures
  // ---------------------------------------------------------------------
  document.addEventListener('touchmove', function (e) {
    if (e.scale && e.scale !== 1) e.preventDefault();
  }, { passive: false });

  // ---------------------------------------------------------------------
  // Auto-load the bundled pages, if this file was produced by
  // build-static-flipbook.py (EMBEDDED_MANIFEST non-null in that case).
  // ---------------------------------------------------------------------
  if (EMBEDDED_MANIFEST && EMBEDDED_MANIFEST.length) {
    showLoading('Loading portfolio…');
    initBookFromImages(EMBEDDED_MANIFEST);
  }

})();
  </script>
</body>
</html>
